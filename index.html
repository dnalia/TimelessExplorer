<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelicious Adventures</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
    <style>
        /* Reset margin and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Set body and html to 100% height and width */
        html, body {
            width: 100%;
            height: 100%;
        }

        /* Main body styling */
        body {
            background-color: #ffe6e9;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: 0;
        }

        /* Header styling */
        header {
            font-size: 2.5em;
            color: #333;
            padding: 20px;
            background-color: #ffb3c6;
            width: 100%;
        }

        /* Image container styling */
        .image-container {
            position: relative;
            width: 100vw;
            height: 80vh; /* Adjust height as needed */
            overflow: hidden;
        }

        /* Image styling */
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay text styling */
        .image-container .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2em;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
            padding: 10px 20px;
            border-radius: 8px;
        }

        /* Explore button styling */
        .explore-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2em;
            padding: 10px 20px;
            color: white;
            background-color: #ff577f;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Footer styling */
        footer {
            margin-top: auto;
            padding: 10px;
            background-color: #ffb3c6;
            color: #333;
            font-size: 1.2em;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>🗺️ Travelicious Adventures ✈️</header>

    <div class="image-container">
        <img src="airplane.webp" alt="airplane">
        <div class="overlay-text">Discover Your Next Destination</div>
        <a href="explore.html" class="explore-button">Explore Countries</a>
    </div>

    <footer>
      Explore More Countries with World Explorer <br>
      socials:
    </footer>
</body>
</html>
